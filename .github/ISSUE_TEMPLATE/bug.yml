name: Problema
description: Segnala un comportamento riproducibile di Rientro.
title: "[Problema] "
body:
  - type: input
    id: version
    attributes:
      label: Versione di Rientro
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Sistema operativo e dispositivo
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passaggi, risultato atteso e risultato osservato
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Messaggi e allegati oscurati
      description: Non inserire token, password, codici, MAC o dati dell'abitazione.
  - type: checkboxes
    id: privacy
    attributes:
      label: Dati riservati
      options:
        - label: Ho rimosso credenziali e dati personali dagli allegati.
          required: true
